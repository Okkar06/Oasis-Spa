name: Lint & Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Lint client
        run: |
          cd client
          npm ci
          npm run lint
        continue-on-error: true

      - name: Lint server
        run: |
          cd server
          npm ci
          npm run lint
        continue-on-error: true

