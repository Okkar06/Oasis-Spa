services:
  backend:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost:5173

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    ports:
      - '5173:80'
    depends_on:
      - backend
